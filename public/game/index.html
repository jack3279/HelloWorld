<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Overworld Demo</title>
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Overworld demo canvas"></canvas>

      <div id="hud-layer" hidden>
        <div id="touch" aria-hidden="true">
          <button type="button" data-dir="left">◀</button>
          <button type="button" data-dir="right">▶</button>
          <button type="button" data-act="jump">跳</button>
          <button type="button" data-act="use">用</button>
        </div>
      </div>

      <div id="overlay" class="panel">
        <img class="logo" src="/repo-assets/steve-sprites/idle-a.svg" alt="" width="96" height="120" />
        <h1>Overworld Demo</h1>
        <p class="lead">用现有方块、生物、物品和 HUD 素材做的横版试玩。</p>
        <ul class="help">
          <li><kbd>A</kbd><kbd>D</kbd> 或方向键移动</li>
          <li><kbd>空格</kbd> / <kbd>W</kbd> 跳跃</li>
          <li><kbd>J</kbd> / 鼠标左键 挥剑或使用物品</li>
          <li><kbd>1</kbd>–<kbd>9</kbd> 切换快捷栏 · <kbd>E</kbd> 吃东西</li>
        </ul>
        <p class="goal">收集 <strong>5 颗钻石</strong>，走到尽头的箱子。</p>
        <div class="actions">
          <button type="button" id="start" class="mc-btn">开始游戏</button>
          <button type="button" id="demo" class="mc-btn">看一段演示</button>
        </div>
        <p id="load-status">正在载入素材…</p>
      </div>
    </div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
